name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: xcode-27
    permissions:
      # Pushes to main publish the metrics branch
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.2
      # CI only compares; recording happens locally where the changes can be reviewed
      STILLEBEN_RECORD: never
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Verify
        run: scripts/verify.sh
      - name: Publish metrics
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/publish-metrics.sh
